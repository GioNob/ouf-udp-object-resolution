openapi: 3.1.0
info: {title: OUF UDP Governed Serving API, version: 1.0.0}
paths:
  /api/udp/v1/objects/{id}:
    get: {operationId: readObject, x-ouf-capability: urban.object.read, x-ouf-mcp-eligible: true, responses: {'200': {description: Authorized current view}}}
  /api/udp/v1/objects/{id}/history:
    get: {operationId: readObjectHistory, x-ouf-capability: urban.object.history.read, x-ouf-max-page-size: 100, x-ouf-mcp-eligible: true, responses: {'200': {description: Authorized revision page}}}
  /api/udp/v1/objects:
    get: {operationId: searchObjects, x-ouf-capability: urban.object.search, x-ouf-required-indexed-filter: type, x-ouf-max-page-size: 100, x-ouf-mcp-eligible: true, responses: {'200': {description: Authorized object page}}}
  /api/udp/v1/objects/related-search:
    post: {operationId: relatedSearch, x-ouf-capability: urban.object.related_search, x-ouf-max-target-types: 10, x-ouf-max-results: 200, x-ouf-mcp-eligible: true, responses: {'200': {description: Typed fixed-join cross-domain correlation}}}
  /api/udp/v1/objects/{id}/relationships:
    get: {operationId: readRelationships, x-ouf-capability: urban.relationship.read, x-ouf-max-page-size: 100, x-ouf-mcp-eligible: true, responses: {'200': {description: Authorized edges without hidden degree}}}
  /api/udp/v1/objects/{id}/lineage:
    get: {operationId: readObjectLineage, x-ouf-capability: lineage.object.read, x-ouf-max-results: 200, x-ouf-mcp-eligible: true, responses: {'200': {description: Redacted lineage}}}
  /api/udp/v1/graph/neighbors:
    post: {operationId: graphNeighbors, x-ouf-capability: urban.graph.neighbors, x-ouf-max-nodes: 200, x-ouf-max-edges: 500, x-ouf-mcp-eligible: true, responses: {'200': {description: Bounded one-hop adjacency}}}
  /api/udp/v1/graph/traverse:
    post: {operationId: graphTraverse, x-ouf-capability: urban.graph.traverse, x-ouf-use-when: recursive hierarchy only, x-ouf-do-not-use-when: exploratory or cross-domain correlation, x-ouf-max-depth: 4, x-ouf-max-nodes: 500, x-ouf-max-edges: 1000, x-ouf-mcp-eligible: true, responses: {'200': {description: Bounded recursive traversal}}}
  /api/udp/v1/spatial/nearby:
    post: {operationId: spatialNearby, x-ouf-capability: urban.spatial.nearby, x-ouf-max-distance-meters: 50000, x-ouf-max-results: 200, x-ouf-mcp-eligible: true, responses: {'200': {description: Governed PostGIS proximity query}}}
  /api/udp/v1/spatial/intersects:
    post: {operationId: spatialIntersects, x-ouf-capability: urban.spatial.intersects, x-ouf-crs: 'EPSG:4326', x-ouf-max-area-sq-km: 2500, x-ouf-max-results: 200, x-ouf-mcp-eligible: true, responses: {'200': {description: Governed envelope intersection}}}
  /api/udp/v1/spatial/within:
    post: {operationId: spatialWithin, x-ouf-capability: urban.spatial.within, x-ouf-crs: 'EPSG:4326', x-ouf-max-area-sq-km: 2500, x-ouf-max-results: 200, x-ouf-mcp-eligible: true, responses: {'200': {description: Governed envelope containment}}}
  /api/udp/v1/spatial/intersection-search:
    post: {operationId: spatialIntersectionSearch, x-ouf-capability: urban.spatial.intersection_search, x-ouf-max-results: 200, x-ouf-mcp-eligible: true, responses: {'200': {description: Governed cross-domain spatial correlation}}}
