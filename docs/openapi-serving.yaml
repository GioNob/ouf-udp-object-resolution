openapi: 3.1.0
info: {title: OUF UDP Governed Serving API, version: 1.0.0}
paths:
  /api/udp/v1/objects/{id}:
    get: {operationId: readObject, x-ouf-capability: urban.object.read, x-ouf-mcp-eligible: true, responses: {'200': {description: Authorized current view}}}
  /api/udp/v1/objects/{id}/history:
    get: {operationId: readObjectHistory, x-ouf-capability: urban.object.history.read, x-ouf-max-page-size: 100, x-ouf-mcp-eligible: true, responses: {'200': {description: Authorized revision page}}}
  /api/udp/v1/objects:
    get: {operationId: searchObjects, x-ouf-capability: urban.object.search, x-ouf-required-indexed-filter: type, x-ouf-max-page-size: 100, x-ouf-mcp-eligible: true, responses: {'200': {description: Authorized object page}}}
  /api/udp/v1/objects/{id}/relationships:
    get: {operationId: readRelationships, x-ouf-capability: urban.relationship.read, x-ouf-max-page-size: 100, x-ouf-mcp-eligible: true, responses: {'200': {description: Authorized edges without hidden degree}}}
  /api/udp/v1/objects/{id}/lineage:
    get: {operationId: readObjectLineage, x-ouf-capability: lineage.object.read, x-ouf-max-results: 200, x-ouf-mcp-eligible: true, responses: {'200': {description: Redacted lineage}}}
