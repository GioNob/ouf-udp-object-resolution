spring:
  application.name: ouf-udp-object-resolution
  datasource:
    url: ${OUF_UDP_DB_URL}
    username: ${OUF_UDP_DB_USER}
    password: ${OUF_UDP_DB_PASSWORD}
  flyway:
    schemas: ouf_udp
    default-schema: ouf_udp
    create-schemas: true
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.probes.enabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: ${OUF_UDP_SHUTDOWN_TIMEOUT:45s}
ouf.udp.lake:
  required: ${OUF_UDP_LAKE_REQUIRED:true}
  raw-retention-days: ${OUF_UDP_RAW_RETENTION_DAYS:0}
  raw-retention-class: ${OUF_UDP_RAW_RETENTION_CLASS:}
  raw-access-label: ${OUF_UDP_RAW_ACCESS_LABEL:}
  tenant-id: ${OUF_UDP_TENANT_ID:}
  s3:
    bucket: ${OUF_UDP_S3_BUCKET:}
    endpoint: ${OUF_UDP_S3_ENDPOINT:}
    region: ${OUF_UDP_S3_REGION:us-east-1}
    path-style: ${OUF_UDP_S3_PATH_STYLE:false}
  maintenance:
    worker-id: ${OUF_UDP_LAKE_MAINTENANCE_WORKER_ID:}
    poll-ms: ${OUF_UDP_LAKE_MAINTENANCE_POLL_MS:60000}
    initial-delay-ms: ${OUF_UDP_LAKE_MAINTENANCE_INITIAL_DELAY_MS:300000}
    lease-seconds: ${OUF_UDP_LAKE_MAINTENANCE_LEASE_SECONDS:900}
  shadow:
    worker-id: ${OUF_UDP_LAKE_SHADOW_WORKER_ID:}
    poll-ms: ${OUF_UDP_LAKE_SHADOW_POLL_MS:60000}
    initial-delay-ms: ${OUF_UDP_LAKE_SHADOW_INITIAL_DELAY_MS:300000}
    lease-seconds: ${OUF_UDP_LAKE_SHADOW_LEASE_SECONDS:1800}
