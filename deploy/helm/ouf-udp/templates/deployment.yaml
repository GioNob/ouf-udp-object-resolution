apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ouf-udp.name" . }}
  labels: {app.kubernetes.io/name: {{ include "ouf-udp.name" . }}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "ouf-udp.name" . }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "ouf-udp.name" . }}}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.shutdown.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10004
        runAsGroup: 10004
        fsGroup: 10004
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: "{{ required "image.repository is required" .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          envFrom:
            - secretRef: {name: {{ required "runtime.existingSecret is required" .Values.runtime.existingSecret }}}
            - configMapRef: {name: {{ required "runtime.existingConfigMap is required" .Values.runtime.existingConfigMap }}}
          {{- if .Values.runtime.gridManifestConfigMap }}
          env:
            - {name: OUF_UDP_GRID_MANIFEST, value: /opt/ouf/proj/manifest.json}
          {{- end }}
          lifecycle:
            preStop:
              exec: {command: ["sh", "-c", "sleep {{ .Values.shutdown.preStopSeconds }}"]}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.runtime.gridManifestConfigMap }}
            - {name: proj-manifest, mountPath: /opt/ouf/proj, readOnly: true}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.runtime.gridManifestConfigMap }}
        - name: proj-manifest
          configMap:
            name: {{ .Values.runtime.gridManifestConfigMap | quote }}
            defaultMode: 0444
            items:
              - {key: manifest.json, path: manifest.json}
        {{- end }}
