name: Linked property reconciliation
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  property-postgresql17:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env: {POSTGRES_DB: ouf_udp_property, POSTGRES_USER: ouf_udp, POSTGRES_PASSWORD: ci-only-password}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ouf_udp -d ouf_udp_property" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OUF_UDP_DB_URL: jdbc:postgresql://127.0.0.1:5432/ouf_udp_property
      OUF_UDP_DB_USER: ouf_udp
      OUF_UDP_DB_PASSWORD: ci-only-password
      OUF_UDP_LAKE_REQUIRED: 'false'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '4'
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: |
          bash scripts/install-authorization-sdk.sh
          mvn -B -ntp -Dtest=LinkedPropertyReconcilerTest,LinkedPropertyRuntimeTest,CanonicalMaterializerRuntimeTest,TemporalDeltaRuntimeTest,GovernedServingRuntimeTest,PublishedIdentityPolicyTest,IdentityGovernanceRuntimeTest,ScopedIdentityCandidateRepositoryRuntimeTest test
      - name: Require native tests without skips
        run: |
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as E
          files=glob.glob('target/surefire-reports/TEST-*LinkedProperty*Test.xml')+glob.glob('target/surefire-reports/TEST-*ScopedIdentityCandidateRepositoryRuntimeTest.xml')
          assert len(files)==3
          for f in files:
              r=E.parse(f).getroot()
              assert int(r.attrib['tests'])>0 and all(int(r.attrib.get(k,0))==0 for k in ('failures','errors','skipped'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'property-reconciliation-${{ github.run_id }}', path: 'target/surefire-reports/', retention-days: 30}
