name: UDP materialization recovery tests
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  recovery-postgresql17:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env: {POSTGRES_DB: ouf_udp_recovery, POSTGRES_USER: ouf_udp, POSTGRES_PASSWORD: ci-only-password}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ouf_udp -d ouf_udp_recovery" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OUF_UDP_DB_URL: jdbc:postgresql://127.0.0.1:5432/ouf_udp_recovery
      OUF_UDP_DB_USER: ouf_udp
      OUF_UDP_DB_PASSWORD: ci-only-password
      OUF_UDP_LAKE_REQUIRED: 'false'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '4'
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Verify recovery transaction and reference gate
        run: |
          bash scripts/install-authorization-sdk.sh
          timeout --signal=TERM --kill-after=30s 10m mvn -B -ntp -Dtest=MaterializationRecoveryRuntimeTest,ReferenceFailureEvidenceTest,MaterializationReferenceGateRuntimeTest test
      - name: Upload recovery test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'udp-recovery-${{ github.run_id }}', path: 'target/surefire-reports/', retention-days: 30}
