name: UDP Object Resolution module CI
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  java21-postgresql17:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env: {POSTGRES_DB: ouf_udp, POSTGRES_USER: ouf_udp, POSTGRES_PASSWORD: ci-only-password}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ouf_udp -d ouf_udp" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OUF_UDP_DB_URL: jdbc:postgresql://127.0.0.1:5432/ouf_udp
      OUF_UDP_DB_USER: ouf_udp
      OUF_UDP_DB_PASSWORD: ci-only-password
      OUF_UDP_LAKE_REQUIRED: 'false'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '4'
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: '0'
      AWS_ACCESS_KEY_ID: minio-ci-access
      AWS_SECRET_ACCESS_KEY: minio-ci-secret
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - name: Validate PET traceability overlay
        run: python3 scripts/ci/verify-pet-traceability.py
      - name: Validate MCP capability manifest
        run: python3 scripts/ci/verify-mcp-capability-manifest.py
      - name: Run agent tool-selection regression
        run: python3 scripts/ci/verify-tool-selection-regression.py
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Start MinIO acceptance service
        run: |
          docker run -d --name udp-minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs udp-minio
          exit 1
      - name: Verify and package
        run: |
          bash scripts/install-authorization-sdk.sh
          timeout --signal=TERM --kill-after=30s 20m mvn -B -ntp clean verify
      - name: Build non-root container
        run: docker build -t ouf-udp:${{ github.sha }} . && test "$(docker image inspect ouf-udp:${{ github.sha }} --format '{{.Config.User}}')" = "10004:10004"
      - name: Verify runtime SDK packaging
        run: |
          jar tf target/udp-object-resolution-*.jar > target/sdk-packaging.txt
          grep -q 'BOOT-INF/lib/authorization-sdk-1.2.0.jar' target/sdk-packaging.txt
          if grep -q 'authorization-sdk-1.2.0-tests.jar' target/sdk-packaging.txt; then exit 1; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'udp-evidence-${{ github.run_id }}', path: 'target/surefire-reports/', retention-days: 30}
  disaster-recovery-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Package recovery subject
        run: |
          bash scripts/install-authorization-sdk.sh
          mvn -B -ntp -DskipTests package
      - name: Execute PostgreSQL PITR and MinIO restore drill
        run: bash scripts/ci/pitr-minio-restore-drill.sh
      - name: Upload disaster recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'udp-dr-evidence-${{ github.run_id }}', path: 'target/dr-evidence/', retention-days: 30}
  performance-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env: {POSTGRES_DB: ouf_udp_perf, POSTGRES_USER: ouf_udp, POSTGRES_PASSWORD: ci-only-password}
        ports: ['55434:5432']
        options: >-
          --health-cmd "pg_isready -U ouf_udp -d ouf_udp_perf" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OUF_UDP_DB_URL: jdbc:postgresql://127.0.0.1:55434/ouf_udp_perf
      OUF_UDP_DB_USER: ouf_udp
      OUF_UDP_DB_PASSWORD: ci-only-password
      OUF_UDP_LAKE_REQUIRED: 'false'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '4'
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Execute reproducible performance gate
        run: |
          bash scripts/install-authorization-sdk.sh
          timeout --signal=TERM --kill-after=30s 15m mvn -B -ntp -Dtest=PerformanceBaselineIT test
      - name: Freeze performance evidence checksums
        if: always()
        run: if test -f target/performance-evidence/PERFORMANCE_RESULT.json; then (cd target/performance-evidence && sha256sum PERFORMANCE_RESULT.json PERFORMANCE_RESULT.md >SHA256SUMS); fi
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'udp-performance-evidence-${{ github.run_id }}', path: 'target/performance-evidence/', retention-days: 30}
  supply-chain-deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Package application and CycloneDX SBOM
        run: |
          bash scripts/install-authorization-sdk.sh
          mvn -B -ntp -DskipTests package
      - name: Validate SBOM
        run: |
          test -s target/classes/META-INF/sbom/application.cdx.json
          python3 - <<'PY'
          import json
          with open('target/classes/META-INF/sbom/application.cdx.json', encoding='utf-8') as source:
              bom = json.load(source)
          assert bom['bomFormat'] == 'CycloneDX'
          assert bom['specVersion']
          assert bom.get('components')
          PY
      - name: Build deployable image
        run: docker build -t ouf-udp:${{ github.sha }} .
      - name: Scan image and write machine-readable evidence
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ouf-udp:${{ github.sha }}
          format: json
          output: target/trivy-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Enforce vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ouf-udp:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Validate deployment chart
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.19.0 lint deploy/helm/ouf-udp
          docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.19.0 template udp deploy/helm/ouf-udp \
            --set image.repository=registry.example.invalid/ouf-udp \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set runtime.existingSecret=udp-runtime \
            --set runtime.existingConfigMap=udp-runtime \
            --set runtime.gridManifestConfigMap=udp-proj-manifest-v1 > target/rendered-deployment.yaml
          python3 scripts/ci/verify-deployment.py target/rendered-deployment.yaml
      - name: Freeze supply-chain evidence
        if: always()
        run: |
          mkdir -p target/supply-chain-evidence
          cp target/classes/META-INF/sbom/application.cdx.json target/supply-chain-evidence/cyclonedx-sbom.json 2>/dev/null || true
          cp target/trivy-image.json target/supply-chain-evidence/trivy-image.json 2>/dev/null || true
          cp target/rendered-deployment.yaml target/supply-chain-evidence/rendered-deployment.yaml 2>/dev/null || true
          (cd target/supply-chain-evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs -r sha256sum > SHA256SUMS)
      - name: Upload supply-chain and deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'udp-supply-chain-deployment-evidence-${{ github.run_id }}', path: 'target/supply-chain-evidence/', retention-days: 30}
