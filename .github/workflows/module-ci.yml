name: UDP Object Resolution module CI
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  java21-postgresql17:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: ouf_udp, POSTGRES_USER: ouf_udp, POSTGRES_PASSWORD: ci-only-password}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ouf_udp -d ouf_udp" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OUF_UDP_DB_URL: jdbc:postgresql://127.0.0.1:5432/ouf_udp
      OUF_UDP_DB_USER: ouf_udp
      OUF_UDP_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Verify and package
        run: timeout --signal=TERM --kill-after=30s 20m mvn -B -ntp clean verify
      - name: Build non-root container
        run: docker build -t ouf-udp:${{ github.sha }} . && test "$(docker image inspect ouf-udp:${{ github.sha }} --format '{{.Config.User}}')" = "10004:10004"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'udp-evidence-${{ github.run_id }}', path: 'target/surefire-reports/', retention-days: 30}
